<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Wizard</title>
</head>

<body>
    <app-header></app-header>
 <!-- breadcrumb start -->
 <div class="breadcrumb-area bg-overlay" style="background-image:url('assets/img/bg/3.png')">
    <div class="container">
        <div class="breadcrumb-inner">
            <div class="section-title mb-0 text-center">
                <h2 class="page-title">Create Article</h2>
                <ul class="page-list">
                    <li><a routerLink="" href="index.html">Home</a></li>
                    <li>Create Article</li>
                </ul>
            </div>
        </div>
    </div>
</div>
<!-- breadcrumb end -->
<div class="container" style="margin-top: 50px;margin-left: 200px; margin-bottom: 100px;">
    <div class="row">
      <div class="create-subreddit-container">
        <form class="post-form" [formGroup]="createArticleForm" (ngSubmit)="createArticle()">
          <div class="form-group">
            <div class="create-subreddit-heading">Create Article</div>
            <hr />
            <input type="text" [formControlName]="'titre'" class="form-control" style="margin-top: 5px"
              placeholder="Title">
            <input type="text" [formControlName]="'category'" class="form-control" style="width: 100%; margin-top: 5px"
              placeholder="Category">
            <div>
              <div style="margin-top: 5px" class="float-right">
                <button (click)="discard()" class="btnDiscard">Discard</button>
                <button class="btnCreateSubreddit">Create</button>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="col-md-3" style="margin-left: 100px;">
        <div class="sidebar">
          <h5 class="guidelines">Posting to Courzelo Forum</h5>
          <hr />
          <ul>
            <li>Remember the human</li>
            <hr />
            <li>Behave like you would in real life</li>
            <hr />
            <li>Don't spam</li>
            <hr />
          </ul>
        </div>
      </div>
    </div>
  </div>
