
<div class="input-block">
  <div>
      <label>Email:</label>
      <input type="email" [(ngModel)]="email" required>
    </div>
    <div>
      <label>Amount:</label>
      <input type="number" [(ngModel)]="amount" required>
    </div>
  <div>
    <button (click)="pay(amount)" class="btn btn-primary btn-block">Pay $ {{amount}}</button>

  </div>

  <div>   
       
    <button (click)="pdfGenerator()" class="btn btn-primary btn-block">Facture</button>
  </div>

</div>
