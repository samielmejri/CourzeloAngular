<!-- Content Wrapper. Contains page content -->
<!-- Content Header (Page header) -->
<section class="content-header">
  <div class="container-fluid">
      <div class="col-sm-6">
          <!-- Notification area -->
      </div><!-- /.col -->
      <div class="row mb-2" style="margin-top: 100px; margin-left: auto; margin-right: auto; width: fit-content;">
          <div class="b-animate-2 title">
              <h1 class="b-animate-2 title">Users Table</h1>
          </div>
      </div>
  </div><!-- /.container-fluid -->
</section>

<!-- Main content -->
<section class="content" style="height: 65vh;margin-left: 250px;">
  <div class="profile-content-container">
      <!-- Users Table Content -->
      <div class="container-fluid">
          <div class="row">
              <div class="col-12 table-container">
                  <div class="card">
                      <div class="card-header">
                          <h3 class="card-title">List Of User's Accounts</h3>
                      </div>
                      <!-- /.card-header -->
                      <div class="card-body table-responsive p-0">
                          <table class="table table-hover">
                              <thead>
                                  <tr>
                                      <th>Email</th>
                                      <th>Name</th>
                                      <th>Lastname</th>
                                      <th>Roles</th>
                                      <th>Ban</th>
                                      <th>Enabled</th>
                                      <th>Actions</th> <!-- New column for actions -->
                                  </tr>
                              </thead>
                              <tbody>
                                  <tr *ngFor="let user of userResponse">
                                      <td><a class="email-link" (click)="openUserProfile(user.email!)">{{ user.email }}</a></td>
                                      <td>{{ user.name }}</td>
                                      <td>{{ user.lastname }}</td>
                                      <td>
                                          <ul>
                                              <li *ngFor="let role of user.roles">{{ role}}</li>
                                          </ul>
                                      </td>
                                      <td>
                                          <button (click)="toggleBan(user)" [ngClass]="{'btn-danger': user.ban, 'btn-success': !user.ban}" class="btn btn-sm">
                                              {{ user.ban ? 'Unban' : 'Ban' }}
                                          </button>
                                      </td>
                                      <td>
                                          <button (click)="toggleEnable(user)" [ngClass]="{'btn-danger': !user.enabled, 'btn-success': user.enabled}" class="btn btn-sm">
                                              {{ user.enabled ? 'Disable' : 'Enable' }}
                                          </button>
                                      </td>
                                      <td> <!-- New column for role change -->
                                          <form (ngSubmit)="changeUserRole(user)">
                                              <div class="form-group">
                                                  <select [(ngModel)]="selectedRole" class="form-control" name="role">
                                                      <option *ngFor="let role of availableRoles" [value]="role">{{ role }}</option>
                                                  </select>
                                              </div>
                                              <button class="btn btn-primary" type="submit">Add/Remove Role</button>
                                          </form>
                                      </td>
                                  </tr>
                              </tbody>
                          </table>
                      </div>
                      <!-- /.card-body -->
                  </div>
              </div>
          </div>
      </div>
  </div>
</section>


    <!-- footer area start -->
    <footer class="footer-area bg-gray">
        <div class="footer-bottom">
            <div class="container">
                <div class="row">
                    <div class="col-lg-4 col-md-6 align-self-center">
                        <a href="index.html"><img src="assets/img/logo.png" alt="img"></a>
                    </div>
                    <div class="col-lg-4  col-md-6 order-lg-12 text-md-right align-self-center">
                        <ul class="social-media mt-md-0 mt-3">
                            <li><a class="facebook" href="#"><i class="fa fa-facebook"></i></a></li>
                            <li><a class="twitter" href="#"><i class="fa fa-twitter"></i></a></li>
                            <li><a class="instagram" href="#"><i class="fa fa-instagram"></i></a></li>
                            <li><a class="youtube" href="#"><i class="fa fa-youtube"></i></a></li>
                            <li><a class="pinterest" href="#"><i class="fa fa-pinterest"></i></a></li>
                        </ul>
                    </div>
                    <div class="col-lg-4 order-lg-8 text-lg-center align-self-center mt-lg-0 mt-3">
                        <p>Courzelo team</p>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <!-- footer area end -->
