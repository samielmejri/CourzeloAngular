<!-- Content Wrapper. Contains page content -->
<!-- Content Header (Page header) -->
<section class="content-header">
  <div class="container-fluid">
      <div class="col-sm-6">
          <!-- Notification area -->
      </div><!-- /.col -->
      <div class="row mb-2" style="margin-top: 100px; margin-left: auto; margin-right: auto; width: fit-content;">
          <div class="b-animate-2 title">
              <h1 class="b-animate-2 title"><i class="fa fa-search"></i> Search</h1>
          </div>
      </div>
  </div><!-- /.container-fluid -->
</section>

<!-- Main content -->
<section class="content" style="height: 65vh;margin-left: 250px;">
  <div class="profile-content-container">
      <!-- Users Table Content -->
      <div class="container-fluid">
          <div class="row">
              <div class="col-12 table-container">
                  <div class="card">
                      <div class="card-header">
                          <h3 class="card-title">Search For students</h3>
                      </div>

<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <form (ngSubmit)="search()" [formGroup]="searchForm">
        <div class="input-group mb-3">
          <input formControlName="keyword" type="search" class="form-control form-control-lg" placeholder="Type your keywords here" matInput [matAutocomplete]="auto">
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
              {{option}}
            </mat-option>
          </mat-autocomplete>
          <div class="input-group-append">
            <button type="submit" class="btn btn-lg btn-default">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <hr>
  <div class="row mt-3" infiniteScroll [infiniteScrollDistance]="1" (scrolled)="searchMoreUsers()">
    <!-- Add this block -->
    <div *ngIf="isLoading" class="text-center w-100">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>
    <!-- End of block -->
    <div *ngFor="let user of Users" class="col-md-3 mb-3">
      <app-user-profile-by-email [isPerfectProfile]="isPerfect(user)" [loginResponse]="user"><i class="fa fa-user"></i></app-user-profile-by-email>
    </div>
  </div>
</div>
